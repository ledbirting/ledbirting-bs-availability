name: Build & publish availability site

on:
  schedule:
    # Every 20 minutes, Monday–Friday, 07:00–17:59 UTC (Iceland time == UTC)
    - cron: "*/20 7-17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-availability-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Generate next-30-day JSON
        env:
          BROADSIGN_BASE: ${{ secrets.BROADSIGN_BASE }}
          BROADSIGN_EMAIL: ${{ secrets.BROADSIGN_EMAIL }}
          BROADSIGN_PASSWORD: ${{ secrets.BROADSIGN_PASSWORD }}
        run: node generate.mjs

      - name: Verify Pages bundle
        run: |
          test -f public/index.html || (echo "Missing public/index.html" && exit 1)
          test -f public/fillrate-next30.json || (echo "Missing public/fillrate-next30.json" && exit 1)
          ls -la public/

      - name: Commit fill-rate snapshot to public/
        run: |
          if [ -n "$(git status --porcelain public/fillrate-next30.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/fillrate-next30.json
            git commit -m "Update fill-rate snapshot"
            git push
          else
            echo "No changes to public/fillrate-next30.json."
          fi
      # Pages is published from the main branch (Settings → Pages → /public).
      # A push above triggers GitHub's pages-build-deployment workflow.
